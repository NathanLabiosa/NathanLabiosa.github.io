<!-- Visual enhancements: Progress Bar, Typewriter, Particles, Nav Indicator, Skill Tags -->
<script>
(function () {
  'use strict';

  /* ---- 1. Reading Progress Bar ---- */
  var bar = document.createElement('div');
  bar.id = 'reading-progress';
  document.body.prepend(bar);
  window.addEventListener('scroll', function () {
    var scrolled = window.scrollY;
    var total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (total > 0 ? (scrolled / total) * 100 : 0) + '%';
  }, { passive: true });

  /* ---- 2. Typewriter Effect on author bio ---- */
  var bioEl = document.querySelector('.author__bio');
  if (bioEl) {
    var fullText = bioEl.textContent.trim();
    bioEl.textContent = '';
    var cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    bioEl.appendChild(cursor);
    var idx = 0;
    function typeNext() {
      if (idx < fullText.length) {
        cursor.insertAdjacentText('beforebegin', fullText[idx++]);
        setTimeout(typeNext, 26 + Math.random() * 22);
      } else {
        setTimeout(function () {
          cursor.style.transition = 'opacity 0.6s';
          cursor.style.opacity = '0';
          setTimeout(function () { cursor.remove(); }, 600);
        }, 1800);
      }
    }
    setTimeout(typeNext, 700);
  }

  /* ---- 3. Neural Network Background ---- */
  var canvas = document.createElement('canvas');
  canvas.id = 'particle-canvas';
  document.body.prepend(canvas);
  var ctx = canvas.getContext('2d');
  var W, H;
  var LAYERS = [3, 5, 7, 7, 5, 3];
  var nodes = [], conns = [], pulses = [], nodeGlow = [];

  function getColorRGB() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? '129,140,248' : '79,70,229';
  }

  function build() {
    nodes = []; conns = []; nodeGlow = [];
    var marginX = W * 0.12, marginY = H * 0.12;
    var usableW = W - marginX * 2, usableH = H - marginY * 2;
    for (var l = 0; l < LAYERS.length; l++) {
      var count = LAYERS[l];
      var x = marginX + (l / (LAYERS.length - 1)) * usableW;
      for (var n = 0; n < count; n++) {
        var y = marginY + (count === 1 ? usableH / 2 : (n / (count - 1)) * usableH);
        nodes.push({ x: x, y: y, layer: l, idx: n });
        nodeGlow.push(0);
      }
    }
    // Build connections between adjacent layers
    for (var l = 0; l < LAYERS.length - 1; l++) {
      var aStart = 0, bStart = 0;
      for (var ll = 0; ll < l; ll++) aStart += LAYERS[ll];
      for (var ll = 0; ll <= l; ll++) bStart += LAYERS[ll];
      for (var a = 0; a < LAYERS[l]; a++) {
        for (var b = 0; b < LAYERS[l + 1]; b++) {
          conns.push({ a: aStart + a, b: bStart + b });
        }
      }
    }
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    build();
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  // Spawn pulses periodically
  setInterval(function () {
    if (conns.length === 0) return;
    var c = conns[Math.floor(Math.random() * conns.length)];
    // ~50% chance to travel forward, 50% backward for variety
    var forward = Math.random() > 0.5;
    pulses.push({ conn: c, t: 0, speed: 0.008 + Math.random() * 0.006, fwd: forward });
  }, 160);

  function nnFrame() {
    if (document.hidden) { requestAnimationFrame(nnFrame); return; }
    ctx.clearRect(0, 0, W, H);
    var rgb = getColorRGB();

    // Draw connections
    ctx.lineWidth = 0.7;
    for (var i = 0; i < conns.length; i++) {
      var c = conns[i];
      var na = nodes[c.a], nb = nodes[c.b];
      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = 'rgba(' + rgb + ',0.07)';
      ctx.stroke();
    }

    // Draw nodes
    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      var glow = nodeGlow[i];
      nodeGlow[i] = Math.max(0, glow - 0.018);
      var r = 2.5 + glow * 3;
      if (glow > 0.05) {
        var grad = ctx.createRadialGradient(nd.x, nd.y, 0, nd.x, nd.y, r * 4);
        grad.addColorStop(0, 'rgba(' + rgb + ',' + (glow * 0.5) + ')');
        grad.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.beginPath();
        ctx.arc(nd.x, nd.y, r * 4, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(nd.x, nd.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + rgb + ',' + (0.25 + glow * 0.55) + ')';
      ctx.fill();
    }

    // Update and draw pulses
    var alive = [];
    for (var i = 0; i < pulses.length; i++) {
      var p = pulses[i];
      p.t += p.speed;
      if (p.t >= 1) {
        // Activate destination node
        var destIdx = p.fwd ? p.conn.b : p.conn.a;
        nodeGlow[destIdx] = Math.min(1, nodeGlow[destIdx] + 0.9);
        continue;
      }
      alive.push(p);
      var na = nodes[p.conn.a], nb = nodes[p.conn.b];
      var t = p.fwd ? p.t : 1 - p.t;
      var px = na.x + (nb.x - na.x) * t;
      var py = na.y + (nb.y - na.y) * t;

      // Trail
      var trailLen = 0.12;
      var t0 = Math.max(0, t - trailLen);
      var tx0 = na.x + (nb.x - na.x) * t0;
      var ty0 = na.y + (nb.y - na.y) * t0;
      var grad = ctx.createLinearGradient(tx0, ty0, px, py);
      grad.addColorStop(0, 'rgba(' + rgb + ',0)');
      grad.addColorStop(1, 'rgba(' + rgb + ',0.75)');
      ctx.beginPath();
      ctx.moveTo(tx0, ty0);
      ctx.lineTo(px, py);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Pulse dot
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + rgb + ',0.9)';
      ctx.fill();
    }
    pulses = alive;
    ctx.globalAlpha = 1;
    requestAnimationFrame(nnFrame);
  }
  nnFrame();

  /* ---- 4. Active Nav Indicator ---- */
  var greedy = document.querySelector('.greedy-nav');
  if (greedy) {
    var ind = document.createElement('div');
    ind.id = 'nav-indicator';
    greedy.appendChild(ind);

    var navLinks = Array.from(greedy.querySelectorAll(
      '.visible-links .masthead__menu-item:not(.masthead__menu-item--lg):not(#theme-toggle) a'
    ));

    var currentPath = window.location.pathname;
    var activeLink = navLinks.find(function (a) {
      var h = a.getAttribute('href');
      return h && (h === currentPath || (currentPath.length > 1 && currentPath.startsWith(h)));
    }) || null;

    function moveInd(linkEl, instant) {
      var gr = greedy.getBoundingClientRect();
      var lr = linkEl.getBoundingClientRect();
      if (instant) ind.style.transition = 'none';
      ind.style.left    = (lr.left - gr.left) + 'px';
      ind.style.width   = lr.width + 'px';
      ind.style.opacity = '1';
      if (instant) requestAnimationFrame(function () { ind.style.transition = ''; });
    }

    function resetInd() {
      if (activeLink) moveInd(activeLink);
      else { ind.style.opacity = '0'; ind.style.width = '0'; }
    }

    if (activeLink) moveInd(activeLink, true);

    navLinks.forEach(function (link) {
      link.addEventListener('mouseenter', function () { moveInd(link); });
    });
    greedy.addEventListener('mouseleave', resetInd);
  }

  /* ---- 5. Skill Tag Toggle ---- */
  document.querySelectorAll('.skill-tag').forEach(function (tag) {
    tag.addEventListener('click', function () { tag.classList.toggle('is-active'); });
  });

})();
</script>

<!-- Scroll-spy Table of Contents with toggle button -->
<script>
(function () {
  function buildTOC() {
    var headings = document.querySelectorAll('.page__content h2, .page__content h3, .archive h2, .archive h3');
    if (headings.length < 2) return;

    // --- Build panel ---
    var toc = document.createElement('nav');
    toc.id = 'custom-toc';
    toc.setAttribute('aria-label', 'On this page');

    var title = document.createElement('div');
    title.className = 'custom-toc__title';
    title.textContent = 'On this page';
    toc.appendChild(title);

    var list = document.createElement('ul');
    list.className = 'custom-toc__list';

    headings.forEach(function (heading, i) {
      if (!heading.id) heading.id = 'toc-' + i;

      var li = document.createElement('li');
      li.className = 'custom-toc__item' +
        (heading.tagName === 'H3' ? ' custom-toc__item--sub' : '');

      var a = document.createElement('a');
      a.href = '#' + heading.id;
      a.className = 'custom-toc__link';
      a.textContent = heading.textContent;

      a.addEventListener('click', function (e) {
        e.preventDefault();
        heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + heading.id);
        toc.classList.remove('is-open');
      });

      li.appendChild(a);
      list.appendChild(li);
    });

    toc.appendChild(list);
    document.body.appendChild(toc);

    // --- Build toggle button ---
    var btn = document.createElement('button');
    btn.id = 'toc-toggle-btn';
    btn.setAttribute('aria-label', 'Toggle table of contents');
    btn.textContent = 'On this page';
    btn.style.display = 'block';
    document.body.appendChild(btn);

    btn.addEventListener('click', function () {
      toc.classList.toggle('is-open');
    });

    // Close panel when clicking outside
    document.addEventListener('click', function (e) {
      if (!toc.contains(e.target) && e.target !== btn) {
        toc.classList.remove('is-open');
      }
    });

    // --- Scroll-spy ---
    var links = toc.querySelectorAll('.custom-toc__link');

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          links.forEach(function (l) { l.classList.remove('is-active'); });
          var active = toc.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('is-active');
        }
      });
    }, { rootMargin: '-8% 0px -80% 0px', threshold: 0 });

    headings.forEach(function (h) { observer.observe(h); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildTOC);
  } else {
    buildTOC();
  }
})();
</script>
