<!-- Visual enhancements: Progress Bar, Typewriter, Particles, Nav Indicator, Skill Tags -->
<script>
(function () {
  'use strict';

  /* ---- 1. Reading Progress Bar ---- */
  var bar = document.createElement('div');
  bar.id = 'reading-progress';
  document.body.prepend(bar);
  window.addEventListener('scroll', function () {
    var scrolled = window.scrollY;
    var total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (total > 0 ? (scrolled / total) * 100 : 0) + '%';
  }, { passive: true });

  /* ---- 2. Typewriter Effect on author bio ---- */
  var bioEl = document.querySelector('.author__bio');
  if (bioEl) {
    var fullText = bioEl.textContent.trim();
    bioEl.textContent = '';
    var cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    bioEl.appendChild(cursor);
    var idx = 0;
    function typeNext() {
      if (idx < fullText.length) {
        cursor.insertAdjacentText('beforebegin', fullText[idx++]);
        setTimeout(typeNext, 26 + Math.random() * 22);
      } else {
        setTimeout(function () {
          cursor.style.transition = 'opacity 0.6s';
          cursor.style.opacity = '0';
          setTimeout(function () { cursor.remove(); }, 600);
        }, 1800);
      }
    }
    setTimeout(typeNext, 700);
  }

  /* ---- 3. Gradient Descent Topology ---- */
  var canvas = document.createElement('canvas');
  canvas.id = 'particle-canvas';
  document.body.prepend(canvas);
  var ctx = canvas.getContext('2d');
  var W, H;
  var GRID = 46;
  var mesh = [];
  var clock = 0;

  function loss(x, y) {
    return Math.sin(x * 1.2) * Math.cos(y * 1.0) * 0.6
         + Math.cos(x * 0.8) * Math.sin(y * 0.9) * 0.4
         + 0.016 * (x * x + y * y);
  }

  function project(gx, gy, gz) {
    var sc  = Math.min(W, H) * 0.098;
    var scz = Math.min(W, H) * 0.13;
    return {
      sx: W * 0.5  + (gx - gy) * 0.866 * sc,
      sy: H * 0.54 + (gx + gy) * 0.5   * sc - gz * scz
    };
  }

  function build() {
    mesh = [];
    for (var j = 0; j <= GRID; j++) {
      var row = [];
      for (var i = 0; i <= GRID; i++) {
        var gx = (i / GRID - 0.5) * 7;
        var gy = (j / GRID - 0.5) * 7;
        var p  = project(gx, gy, loss(gx, gy));
        row.push({ sx: p.sx, sy: p.sy, gx: gx, gy: gy });
      }
      mesh.push(row);
    }
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    build();
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  function getRGB() {
    return document.documentElement.getAttribute('data-theme') === 'dark'
      ? '129,140,248' : '79,70,229';
  }

  function seg(p1, p2, lx, ly, rgb) {
    var mx = (p1.gx + p2.gx) * 0.5, my = (p1.gy + p2.gy) * 0.5;
    var d2 = (mx - lx) * (mx - lx) + (my - ly) * (my - ly);
    var g  = Math.exp(-d2 * 0.22);
    ctx.beginPath();
    ctx.moveTo(p1.sx, p1.sy);
    ctx.lineTo(p2.sx, p2.sy);
    ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.045 + g * 0.32) + ')';
    ctx.lineWidth   = 0.4 + g * 1.0;
    ctx.stroke();
  }

  function topoFrame() {
    if (document.hidden) { requestAnimationFrame(topoFrame); return; }
    clock += 0.0035;
    ctx.clearRect(0, 0, W, H);
    var rgb = getRGB();

    var lx = 2.6 * Math.cos(clock * 0.55);
    var ly = 2.6 * Math.sin(clock * 0.37);

    for (var j = 0; j <= GRID; j++) {
      for (var i = 0; i <= GRID; i++) {
        if (i < GRID) seg(mesh[j][i], mesh[j][i + 1], lx, ly, rgb);
        if (j < GRID) seg(mesh[j][i], mesh[j + 1][i], lx, ly, rgb);
      }
    }
    requestAnimationFrame(topoFrame);
  }
  topoFrame();

  /* ---- 4. Active Nav Indicator ---- */
  var greedy = document.querySelector('.greedy-nav');
  if (greedy) {
    var ind = document.createElement('div');
    ind.id = 'nav-indicator';
    greedy.appendChild(ind);

    var navLinks = Array.from(greedy.querySelectorAll(
      '.visible-links .masthead__menu-item:not(.masthead__menu-item--lg):not(#theme-toggle) a'
    ));

    var currentPath = window.location.pathname;
    var activeLink = navLinks.find(function (a) {
      var h = a.getAttribute('href');
      return h && (h === currentPath || (currentPath.length > 1 && currentPath.startsWith(h)));
    }) || null;

    function moveInd(linkEl, instant) {
      var gr = greedy.getBoundingClientRect();
      var lr = linkEl.getBoundingClientRect();
      if (instant) ind.style.transition = 'none';
      ind.style.left    = (lr.left - gr.left) + 'px';
      ind.style.width   = lr.width + 'px';
      ind.style.opacity = '1';
      if (instant) requestAnimationFrame(function () { ind.style.transition = ''; });
    }

    function resetInd() {
      if (activeLink) moveInd(activeLink);
      else { ind.style.opacity = '0'; ind.style.width = '0'; }
    }

    if (activeLink) moveInd(activeLink, true);

    navLinks.forEach(function (link) {
      link.addEventListener('mouseenter', function () { moveInd(link); });
    });
    greedy.addEventListener('mouseleave', resetInd);
  }

  /* ---- 5. Skill Tag Toggle with per-tag effects ---- */
  function fxNeuralPulse(el) {
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (var i = 0; i < 3; i++) {
      (function(d) {
        setTimeout(function() {
          var r = document.createElement('div');
          r.style.cssText = 'position:fixed;left:'+cx+'px;top:'+cy+'px;width:60px;height:60px;' +
            'border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:9000;' +
            'animation:skillRing 0.75s ease-out forwards;';
          document.body.appendChild(r);
          setTimeout(function(){r.remove();}, 800);
        }, d * 200);
      })(i);
    }
  }

  function fxScanLine() {
    var line = document.createElement('div');
    line.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:3px;pointer-events:none;z-index:9000;' +
      'background:linear-gradient(90deg,transparent,var(--accent),var(--accent-light),var(--accent),transparent);' +
      'animation:skillScan 0.9s linear forwards;';
    document.body.appendChild(line);
    setTimeout(function(){line.remove();}, 950);
  }

  function fxTokens(el) {
    var rect = el.getBoundingClientRect();
    var words = ['token','embed','\u03a3','attend','softmax'];
    words.forEach(function(w, i) {
      setTimeout(function() {
        var t = document.createElement('span');
        t.textContent = w;
        t.style.cssText = 'position:fixed;left:'+(rect.left + rect.width/2 + (i-2)*32)+'px;top:'+(rect.top-4)+'px;' +
          'font-size:11px;font-family:monospace;color:var(--accent);pointer-events:none;z-index:9000;' +
          'animation:skillFloat 1s ease-out forwards;';
        document.body.appendChild(t);
        setTimeout(function(){t.remove();}, 1050);
      }, i * 90);
    });
  }

  function fxFusion(el) {
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    [-50, 50].forEach(function(ox, i) {
      var orb = document.createElement('div');
      orb.style.cssText = 'position:fixed;left:'+(cx+ox)+'px;top:'+cy+'px;width:10px;height:10px;' +
        'border-radius:50%;background:'+(i===0 ? 'var(--accent)' : 'var(--accent-light)')+';' +
        'transform:translate(-50%,-50%);pointer-events:none;z-index:9000;' +
        'transition:left 0.35s ease-in,opacity 0.35s ease-in;';
      document.body.appendChild(orb);
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        orb.style.left = cx+'px'; orb.style.opacity = '0';
      });});
      setTimeout(function(){orb.remove();}, 420);
    });
    setTimeout(function() {
      var flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;left:'+cx+'px;top:'+cy+'px;width:50px;height:50px;' +
        'border-radius:50%;pointer-events:none;z-index:9000;' +
        'background:radial-gradient(circle,rgba(129,140,248,0.8),transparent);' +
        'animation:skillRing 0.5s ease-out forwards;';
      document.body.appendChild(flash);
      setTimeout(function(){flash.remove();}, 560);
    }, 330);
  }

  function fxTerminal(el) {
    var rect = el.getBoundingClientRect();
    var left = Math.min(rect.left, window.innerWidth - 215);
    var term = document.createElement('div');
    term.style.cssText = 'position:fixed;left:'+left+'px;top:'+(rect.bottom+8)+'px;' +
      'background:#0f172a;color:#4ade80;font-family:monospace;font-size:11px;' +
      'padding:8px 12px;border-radius:6px;pointer-events:none;z-index:9000;white-space:pre;' +
      'animation:skillTermFade 2.4s ease forwards;';
    term.textContent = '$ train --epochs 100\n[\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588] 100%  loss: 0.042';
    document.body.appendChild(term);
    setTimeout(function(){term.remove();}, 2500);
  }

  function fxTrajectory(el) {
    var rect = el.getBoundingClientRect();
    var sx = rect.left + rect.width/2, sy = rect.top + rect.height/2;
    var ex = sx + 180, ey = sy - 70;
    var cp1x = sx+55, cp1y = sy-95, cp2x = ex-55, cp2y = ey+55;
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns,'svg');
    svg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9000;';
    var pathEl = document.createElementNS(ns,'path');
    pathEl.setAttribute('d','M'+sx+' '+sy+' C'+cp1x+' '+cp1y+','+cp2x+' '+cp2y+','+ex+' '+ey);
    pathEl.setAttribute('stroke','var(--accent)');
    pathEl.setAttribute('stroke-width','1.5');
    pathEl.setAttribute('fill','none');
    pathEl.setAttribute('stroke-dasharray','5 4');
    pathEl.setAttribute('opacity','0.7');
    var dotEl = document.createElementNS(ns,'circle');
    dotEl.setAttribute('r','4');
    dotEl.setAttribute('fill','var(--accent)');
    svg.appendChild(pathEl);
    svg.appendChild(dotEl);
    document.body.appendChild(svg);
    var start = null;
    function animTraj(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / 900, 1), mp = 1-p;
      dotEl.setAttribute('cx', mp*mp*mp*sx + 3*mp*mp*p*cp1x + 3*mp*p*p*cp2x + p*p*p*ex);
      dotEl.setAttribute('cy', mp*mp*mp*sy + 3*mp*mp*p*cp1y + 3*mp*p*p*cp2y + p*p*p*ey);
      if (p < 1) { requestAnimationFrame(animTraj); }
      else {
        setTimeout(function(){
          svg.style.transition='opacity 0.4s';
          svg.style.opacity='0';
          setTimeout(function(){svg.remove();},450);
        }, 350);
      }
    }
    requestAnimationFrame(animTraj);
  }

  var tagFX = {
    'Deep Learning':  fxNeuralPulse,
    'Computer Vision': fxScanLine,
    'NLP':            fxTokens,
    'Multimodal AI':  fxFusion,
    'ML Engineering': fxTerminal,
    'Robotics':       fxTrajectory
  };

  document.querySelectorAll('.skill-tag').forEach(function (tag) {
    tag.addEventListener('click', function () {
      tag.classList.toggle('is-active');
      if (tag.classList.contains('is-active')) {
        var fn = tagFX[tag.textContent.trim()];
        if (fn) fn(tag);
      }
    });
  });

})();
</script>

<!-- Scroll-spy Table of Contents with toggle button -->
<script>
(function () {
  function buildTOC() {
    var headings = document.querySelectorAll('.page__content h2, .page__content h3, .archive h2, .archive h3');
    if (headings.length < 2) return;

    var toc = document.createElement('nav');
    toc.id = 'custom-toc';
    toc.setAttribute('aria-label', 'On this page');

    var title = document.createElement('div');
    title.className = 'custom-toc__title';
    title.textContent = 'On this page';
    toc.appendChild(title);

    var list = document.createElement('ul');
    list.className = 'custom-toc__list';

    headings.forEach(function (heading, i) {
      if (!heading.id) heading.id = 'toc-' + i;

      var li = document.createElement('li');
      li.className = 'custom-toc__item' +
        (heading.tagName === 'H3' ? ' custom-toc__item--sub' : '');

      var a = document.createElement('a');
      a.href = '#' + heading.id;
      a.className = 'custom-toc__link';
      a.textContent = heading.textContent;

      a.addEventListener('click', function (e) {
        e.preventDefault();
        heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + heading.id);
        toc.classList.remove('is-open');
      });

      li.appendChild(a);
      list.appendChild(li);
    });

    toc.appendChild(list);
    document.body.appendChild(toc);

    var btn = document.createElement('button');
    btn.id = 'toc-toggle-btn';
    btn.setAttribute('aria-label', 'Toggle table of contents');
    btn.textContent = 'On this page';
    btn.style.display = 'block';
    document.body.appendChild(btn);

    btn.addEventListener('click', function () {
      toc.classList.toggle('is-open');
    });

    document.addEventListener('click', function (e) {
      if (!toc.contains(e.target) && e.target !== btn) {
        toc.classList.remove('is-open');
      }
    });

    var links = toc.querySelectorAll('.custom-toc__link');

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          links.forEach(function (l) { l.classList.remove('is-active'); });
          var active = toc.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('is-active');
        }
      });
    }, { rootMargin: '-8% 0px -80% 0px', threshold: 0 });

    headings.forEach(function (h) { observer.observe(h); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildTOC);
  } else {
    buildTOC();
  }
})();
</script>
